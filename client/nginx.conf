server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: fall back to index.html for any non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints filenames in /assets/ (e.g. index-abc123.js), so
    # they're safe to cache aggressively — a new build gets new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
