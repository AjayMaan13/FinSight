# Render Blueprint — provisions the entire FinSight stack (Postgres, API,
# ML service, static client) from a single "New Blueprint" deploy.
# https://render.com/docs/blueprint-spec
#
# Free-tier services spin down after inactivity and take ~30-60s to wake on
# the next request — expected for a demo deployment, not a bug.

databases:
  - name: finsight-db
    plan: free
    databaseName: finsight
    user: finsight

services:
  - type: web
    name: finsight-ml
    runtime: docker
    plan: free
    # No rootDir: dockerfilePath/dockerContext are already fully specified
    # relative to the repo root, and combining them with a rootDir of the
    # same subdirectory doubled the path (ml-service/ml-service), which
    # Render's builder couldn't resolve.
    dockerfilePath: ml-service/Dockerfile
    dockerContext: ml-service
    healthCheckPath: /health

  - type: web
    name: finsight-server
    runtime: docker
    plan: free
    dockerfilePath: server/Dockerfile
    dockerContext: server
    healthCheckPath: /
    # Migrate + seed demo data, then start the API — logic lives in
    # docker-entrypoint.sh (baked into the image) rather than an inline
    # multi-command shell string here, since it was unclear exactly how
    # Render tokenizes/re-wraps dockerCommand and an inline "sh -c '...'"
    # string got mangled into one unparsed "command not found".
    dockerCommand: ./docker-entrypoint.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: finsight-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: finsight-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: finsight-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finsight-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: finsight-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      # CORS allow-origin for the deployed client. Same caveat as
      # VITE_API_URL below: Render can't self-reference another service's
      # public URL, so this is hardcoded to the client's actual assigned
      # URL (it also got a name-collision suffix). Update if the client's
      # URL ever changes, or every request will be blocked by CORS.
      - key: CLIENT_URL
        value: https://finsight-client-0ji3.onrender.com
      # Internal private-network address (host:port) — server-to-server
      # traffic never leaves Render's network, so this stays fast and free.
      # ml-service reads $PORT itself, so no scheme/port assumptions here;
      # mlController.js normalizes a bare host:port into a full http:// URL.
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: finsight-ml
          property: hostport

  - type: web
    name: finsight-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    # Relative to rootDir (not the repo root) once rootDir is set — `vite
    # build` writes to client/dist from the repo root, which is just
    # "dist" from inside the client/ rootDir.
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked into the JS bundle at build time — the browser calls this
      # directly, so it must be finsight-server's PUBLIC URL, not the
      # internal address used above. Render can't self-reference another
      # service's public onrender.com URL in a Blueprint, so this is
      # hardcoded. Render appended a suffix to the server's name (a
      # collision with an existing "finsight-server" elsewhere on Render),
      # so this points at the actual assigned URL, not the plain
      # "finsight-server.onrender.com" the name: field would suggest. If
      # the server's URL ever changes, update this value or every request
      # from the client will silently fail.
      - key: VITE_API_URL
        value: https://finsight-server-0ka4.onrender.com/api
